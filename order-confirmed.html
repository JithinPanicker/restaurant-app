<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order Confirmed</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    
    <style>
        /* Order Confirmed Specific Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #ffffff; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: flex-start; }
        
        .success-wrapper {
            width: 100%; max-width: 450px; background: #ffffff;
            padding: 25px 20px 30px 20px; min-height: 100vh; 
            display: flex; flex-direction: column; position: relative;
        }

        /* Header */
        .success-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px;
        }
        .table-text { font-size: 20px; font-weight: 700; color: #FF3300; }
        .occupied-badge {
            background: #158C26; color: #ffffff;
            font-size: 13px; font-weight: 600;
            padding: 6px 16px; border-radius: 6px;
        }

        /* Main Content */
        .success-content {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            margin-bottom: 40px;
        }
        
        .check-circle {
            width: 100px; height: 100px; background: #158C26;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            margin-bottom: 25px;
        }
        .check-circle svg { width: 50px; height: 50px; stroke: #ffffff; }

        .success-title {
            font-size: 28px; font-weight: 700; color: #158C26;
            text-align: center; margin-bottom: 8px;
        }
        .order-num {
            font-size: 22px; font-weight: 700; color: #FF3300;
            text-align: center; margin-bottom: 15px;
        }
        .success-desc {
            font-size: 15px; font-weight: 400; color: #111;
            text-align: center; line-height: 1.5;
            max-width: 280px;
        }

        /* Buttons */
        .success-actions {
            margin-top: auto;
            display: flex; flex-direction: column; gap: 12px;
        }
        .action-row {
            display: flex; gap: 12px; width: 100%;
        }
        .action-btn {
            flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px;
            background: transparent; border: 1px solid #FF3300;
            border-radius: 12px; padding: 14px 10px;
            font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600;
            color: #FF3300; cursor: pointer; transition: 0.1s ease;
        }
        .action-btn.full-width { flex: none; width: 100%; }
        .action-btn:active { transform: scale(0.97); background: #FFF0E8; }
        
        .action-btn svg { width: 20px; height: 20px; stroke: #FF3300; fill: none; }
        .action-btn svg.fill-path { fill: #FF3300; stroke: none; }
    </style>
</head>
<body>

    <div class="success-wrapper">
        
        <!-- Header -->
        <div class="success-header">
            <span class="table-text" id="header-table-text">Table 05</span>
            <span class="occupied-badge">Occupied</span>
        </div>

        <!-- Main Status Content -->
        <div class="success-content">
            <!-- Green Checkmark -->
            <div class="check-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            
            <h1 class="success-title">Order Placed!</h1>
            <h2 class="order-num">Order #<span id="display-order-num">101</span></h2>
            <p class="success-desc">We’ve received your order<br>and it is being prepared.</p>
        </div>

        <!-- Action Buttons -->
        <div class="success-actions">
            <div class="action-row">
                <button class="action-btn" onclick="alert('Calling the waiter!');">
                    <!-- Bell Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    Call Waiter
                </button>
                <button class="action-btn" onclick="window.location.href='menu.html'">
                    <!-- Shopping Bag Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    Order More
                </button>
            </div>
            
            <button class="action-btn full-width" onclick="alert('Opening Order Status...');">
                <!-- List Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                View Order Status
            </button>
        </div>
    </div>

    <script>
        // Parse the URL parameters to get order number and table number
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order') || '101';
        const tableId = urlParams.get('table') || '05';

        // Update the page with the dynamic values
        document.getElementById('display-order-num').textContent = orderId;
        document.getElementById('header-table-text').textContent = `Table ${tableId}`;
    </script>
</body>
</html>
