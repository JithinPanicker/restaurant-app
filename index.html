<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spice Delight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <div class="main-content">
            <p class="welcome-text">Welcome to</p>
            <div class="logo-wrapper">
                <img src="home-page-images/logo.png" alt="Spice Delight Logo">
            </div>
            <h1 class="brand-title">Spice Delight</h1>
            <h2 class="brand-subtitle">- Family Restaurant -</h2>
            <p class="description">
                Delicious food, made fresh for you.<br>
                Order your favorites for takeaway.
            </p>
            <div class="table-pill">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="6" width="16" height="12" rx="1" />
                    <line x1="4" y1="10" x2="20" y2="10" />
                    <line x1="8" y1="6" x2="8" y2="18" />
                    <line x1="16" y1="6" x2="16" y2="18" />
                </svg>
                <span>Table 05</span>
            </div>
        </div>
        <div class="cta-button-container">
            <a href="menu.html" class="cta-button" id="viewMenuBtn">View Menu</a>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
