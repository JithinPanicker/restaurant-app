<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spice Delight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* =================== MODAL STYLES ADDED =================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(3px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #ffffff; border-radius: 24px; padding: 30px 25px 25px 25px;
            width: 100%; max-width: 340px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-icon-circle {
            width: 80px; height: 80px; border-radius: 50%; border: 1.5px solid #d32f2f;
            display: flex; justify-content: center; align-items: center; margin: 0 auto 15px auto;
        }
        .modal-icon-circle svg { width: 34px; height: 34px; stroke: #d32f2f; fill: none; stroke-width: 2; }
        .modal-title { font-size: 18px; font-weight: 700; color: #d32f2f; margin-bottom: 12px; }
        .modal-desc { font-size: 14px; color: #333; line-height: 1.6; margin-bottom: 8px; }
        .modal-note { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 25px; }
        .modal-call-waiter-btn {
            width: 100%; background: transparent; border: 1px solid #d32f2f; color: #d32f2f;
            padding: 14px; border-radius: 50px; font-family: 'Poppins', sans-serif;
            font-size: 14px; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 8px;
            cursor: pointer; transition: 0.1s;
        }
        .modal-call-waiter-btn:active { transform: scale(0.97); }
        .modal-call-waiter-btn svg { width: 18px; height: 18px; stroke: #d32f2f; fill: none; stroke-width: 2; }
        /* =========================================================== */
    </style>
</head>
<body>
    <div class="app-container">
        <div class="main-content">
            <p class="welcome-text">Welcome to</p>
            <div class="logo-wrapper">
                <img src="home-page-images/logo.png" alt="Spice Delight Logo">
            </div>
            <h1 class="brand-title">Spice Delight</h1>
            <h2 class="brand-subtitle">- Family Restaurant -</h2>
            <p class="description">
                Delicious food, made fresh for you.<br>
                Order your favorites for takeaway.
            </p>
            <div class="table-pill">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="6" width="16" height="12" rx="1" />
                    <line x1="4" y1="10" x2="20" y2="10" />
                    <line x1="8" y1="6" x2="8" y2="18" />
                    <line x1="16" y1="6" x2="16" y2="18" />
                </svg>
                <span>Table 05</span>
            </div>
        </div>
        <div class="cta-button-container">
            <a href="menu.html" class="cta-button" id="viewMenuBtn">View Menu</a>
        </div>
    </div>

    <!-- =================== MODAL HTML ADDED =================== -->
    <div id="occupied-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon-circle">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1" /><line x1="4" y1="10" x2="20" y2="10" /><line x1="8" y1="6" x2="8" y2="18" /><line x1="16" y1="6" x2="16" y2="18" /></svg>
            </div>
            <h3 class="modal-title">Table Currently Occupied</h3>
            <p class="modal-desc">There is an active order in progress for this table.</p>
            <p class="modal-note">Please contact our staff if this table is available.</p>
            <button class="modal-call-waiter-btn" onclick="closeOccupiedModal()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                Call Waiter
            </button>
        </div>
    </div>
    <!-- ========================================================= -->

    <script src="app.js"></script>

    <!-- =================== MODAL JS ADDED =================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('showPopup') === 'true') {
                document.getElementById('occupied-modal').classList.add('active');
            }
        });

        function closeOccupiedModal() {
            document.getElementById('occupied-modal').classList.remove('active');
            // Remove ?showPopup=true from URL so refreshing keeps the popup closed
            const newUrl = window.location.pathname + window.location.hash;
            window.history.replaceState({}, document.title, newUrl);
        }

        // Allow clicking the dark background to close the popup too
        document.getElementById('occupied-modal').addEventListener('click', function(e) {
            if (e.target === this) { 
                closeOccupiedModal(); 
            }
        });
    </script>
    <!-- ====================================================== -->
</body>
</html>
