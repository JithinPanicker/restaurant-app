<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spice Delight - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F05A28">
</head>
<body>
    <div id="app-container">
        <!-- WELCOME SCREEN -->
        <section id="welcome-screen" class="screen active">
            <div class="welcome-content">
                <div class="logo-container">
                    <img src="restaurent-logo.png" alt="Spice Delight Logo" class="main-logo">
                    <h2 class="brand-name">Spice Delight</h2>
                    <p class="brand-subtext">— Family Restaurant —</p>
                </div>
                
                <h1 class="welcome-title">Welcome!</h1>
                <p class="welcome-instructions">Scan QR code to view menu<br>and place your order</p>
                
                <div class="table-card">
                    <p class="table-label">Table Number</p>
                    <h1 class="table-number text-orange">05</h1>
                </div>
                
                <!-- Links to the new HTML file -->
                <button class="btn-primary" onclick="window.location.href='menu.html'">VIEW MENU</button>
            </div>
            
            <img src="welcome-food-image.png" alt="Delicious Food" class="welcome-bottom-image">
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
