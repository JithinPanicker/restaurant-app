<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spice Delight - Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="details-body">
    <div id="app-container" class="details-container">
        
        <div class="details-header">
            <div class="top-actions">
                <span class="icon-btn back-btn" onclick="window.location.href='menu.html'">❮</span>
                <span class="icon-btn like-btn">❤️</span>
            </div>
            <img id="detail-img" src="" alt="Food" class="main-food-img">
        </div>

        <div class="details-content">
            <h2 id="detail-title" class="dish-title">Loading...</h2>
            <p id="detail-price" class="dish-price text-orange"></p>
            <p id="detail-desc" class="dish-desc"></p>

            <div class="quantity-row">
                <span class="qty-label">Quantity</span>
                <div class="qty-controls">
                    <button onclick="changeQty(-1)">−</button>
                    <span id="detail-qty">1</span>
                    <button onclick="changeQty(1)">+</button>
                </div>
            </div>

            <div class="instructions-section">
                <label>Special Instructions (Optional)</label>
                <div class="textarea-wrapper">
                    <textarea id="special-inst" maxlength="100" placeholder="E.g. Less spicy, No onion..." oninput="updateCharCount(this)"></textarea>
                    <span id="char-count" class="char-count">0/100</span>
                </div>
            </div>

            <button class="btn-primary" onclick="addCurrentItemToCart()">ADD TO CART</button>
            <button class="btn-outline-orange">📞 Call Waiter</button>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
