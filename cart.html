<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    
    <style>
        /* Cart Specific Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #f9f9f9; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: flex-start; }
        
        .cart-wrapper {
            width: 100%; max-width: 450px; background: #f9f9f9;
            padding: 20px 20px 120px 20px; min-height: 100vh; position: relative;
        }

        /* Header */
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-top: 5px; }
        .cart-header-left { display: flex; align-items: center; cursor: pointer; gap: 5px; }
        .cart-title { font-size: 20px; font-weight: 700; color: #111; }
        .table-badge { font-size: 15px; font-weight: 600; color: #FF3300; }
        
        .cart-items-label { font-size: 17px; font-weight: 700; color: #111; margin-bottom: 15px; }

        /* Cart Item Card */
        .cart-item-card {
            background: #ffffff; border-radius: 16px; padding: 15px;
            margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex; gap: 15px; position: relative;
        }
        .item-img { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
        .item-content { flex-grow: 1; display: flex; flex-direction: column; }
        
        .item-top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
        .item-name { font-size: 16px; font-weight: 700; color: #111; }
        .delete-btn { cursor: pointer; color: #111; display: flex; padding: 5px; }
        
        .item-unit-price { font-size: 14px; color: #444; margin-bottom: 8px; }

        .special-instruction-box {
            background: #FFF5ED; border-radius: 8px; padding: 10px 12px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border: 1px solid #ffe3d4;
        }
        .special-content { display: flex; align-items: center; gap: 8px; }
        .special-content svg { width: 16px; height: 16px; stroke: #FF3300; flex-shrink: 0; }
        .special-text-wrap { display: flex; flex-direction: column; gap: 2px; }
        .special-label { font-size: 11px; font-weight: 600; color: #FF3300; }
        .special-text { font-size: 12px; color: #333; line-height: 1.3; }
        .edit-btn { font-size: 12px; font-weight: 600; color: #FF3300; cursor: pointer; background: transparent; border: none; padding: 4px; }

        .item-bottom-row { display: flex; justify-content: space-between; align-items: center; }
        .qty-controls-cart {
            display: flex; align-items: center; gap: 0;
            border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden;
        }
        .qty-btn-cart { background: transparent; border: none; padding: 4px 12px; font-size: 18px; font-weight: 600; color: #FF3300; cursor: pointer; }
        .qty-val-cart { padding: 0 8px; font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }
        
        .item-total-price { font-size: 18px; font-weight: 700; color: #111; }

        /* Billing Box */
        .billing-box {
            background: #ffffff; border-radius: 16px; padding: 20px;
            margin-top: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .bill-row { display: flex; justify-content: space-between; font-size: 14px; color: #333; margin-bottom: 12px; }
        .bill-row-total { font-size: 18px; font-weight: 700; color: #111; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #e0e0e0; }

        /* Fixed Bottom Button */
        .cart-bottom-sticky {
            position: fixed; bottom: 0; left: 0; right: 0; max-width: 450px; margin: 0 auto;
            background: #ffffff; padding: 15px 20px 25px 20px; border-top: 1px solid #f0f0f0;
        }
        .btn-place-order {
            width: 100%; padding: 18px; background: #FF3300; color: white;
            border: none; border-radius: 12px; font-size: 18px; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 20px rgba(255, 51, 0, 0.3);
            letter-spacing: 1px;
        }
        .btn-place-order:active { transform: scale(0.97); }

        /* ================== MODAL STYLES ================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 1000;
            display: none; justify-content: center; align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-sheet {
            width: 100%; max-width: 450px; background: #ffffff;
            border-radius: 24px 24px 0 0; padding: 10px 20px 30px 20px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-handle { width: 40px; height: 4px; background: #e0e0e0; border-radius: 4px; margin: 0 auto 20px auto; }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header-left { display: flex; align-items: center; gap: 10px; }
        .modal-header-left svg { width: 24px; height: 24px; stroke: #111; stroke-width: 2; }
        .modal-header-title { font-size: 18px; font-weight: 700; color: #111; }
        .modal-delete-btn { font-size: 14px; font-weight: 500; color: #FF3300; cursor: pointer; background: none; border: none; }

        .modal-textarea-wrapper { position: relative; margin-bottom: 20px; }
        .modal-textarea {
            width: 100%; height: 120px; padding: 14px 14px 30px 14px;
            border: 1px solid #FF3300; border-radius: 8px;
            font-family: 'Poppins', sans-serif; font-size: 14px; color: #222;
            resize: none; outline: none;
        }
        .modal-char-counter {
            position: absolute; bottom: 10px; right: 14px; font-size: 11px; color: #888;
        }
        
        .modal-save-btn {
            width: 100%; padding: 16px; background: #FF3300; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 700;
            cursor: pointer;
        }
        .modal-save-btn:active { transform: scale(0.97); }
        /* ================== END MODAL ================== */
    </style>
</head>
<body>

    <div class="cart-wrapper">
        
        <!-- Header -->
        <div class="cart-header">
            <div class="cart-header-left" onclick="window.location.href='menu.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </div>
            <h2 class="cart-title">Your Cart</h2>
            <div class="table-badge">Table 05</div>
        </div>

        <!-- Items Title -->
        <div id="items-count-label" class="cart-items-label">Items (0)</div>
        
        <!-- Cart Items Container -->
        <div id="cart-list-container"></div>

        <!-- Billing Summary -->
        <div class="billing-box">
            <div class="bill-row">
                <span id="bill-item-total-label">Item Total (0 items)</span>
                <span id="bill-item-total">₹0</span>
            </div>
            <div class="bill-row">
                <span>GST Charges</span>
                <span id="bill-gst">₹0</span>
            </div>
            <div class="bill-row bill-row-total">
                <span>Total</span>
                <span id="bill-grand-total">₹0</span>
            </div>
        </div>

        <!-- Fixed Footer -->
        <div class="cart-bottom-sticky">
            <button class="btn-place-order" onclick="placeOrder()">PLACE ORDER</button>
        </div>
    </div>

    <!-- ================= MODAL FOR EDIT INSTRUCTIONS ================= -->
    <div class="modal-overlay" id="instructions-modal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            
            <div class="modal-header">
                <div class="modal-header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    <span class="modal-header-title">Special Instructions</span>
                </div>
                <button class="modal-delete-btn" onclick="deleteItemFromModal()">Delete</button>
            </div>

            <div class="modal-textarea-wrapper">
                <textarea id="modal-inst-text" maxlength="100" class="modal-textarea"></textarea>
                <div id="modal-char-count" class="modal-char-counter">0/100</div>
            </div>

            <button class="modal-save-btn" onclick="saveInstructions()">Save Changes</button>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('spiceCart')) || [];
        let currentEditIndex = -1;

        function renderCart() {
            const container = document.getElementById('cart-list-container');
            container.innerHTML = '';
            
            let totalItems = 0;
            let totalPrice = 0;

            cart.forEach((item, index) => {
                const itemPriceTotal = item.price * item.qty;
                totalItems += item.qty;
                totalPrice += itemPriceTotal;

                const instructionText = item.instructions && item.instructions.trim() !== "" ? item.instructions : "No special instructions";
                const isPlaceholder = item.instructions && item.instructions.trim() !== "" ? false : true;

                const itemHTML = `
                    <div class="cart-item-card">
                        <img src="${item.img}" alt="${item.name}" class="item-img">
                        <div class="item-content">
                            <div class="item-top-row">
                                <div class="item-name">${item.name}</div>
                                <div class="delete-btn" onclick="deleteItem(${index})">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                </div>
                            </div>
                            <div class="item-unit-price">₹${item.price}</div>
                            
                            <!-- Special Instructions Box visible in all items -->
                            <div class="special-instruction-box">
                                <div class="special-content">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                    <div class="special-text-wrap">
                                        <span class="special-label">Special Instructions</span>
                                        <span class="special-text" style="${isPlaceholder ? 'color:#999;' : ''}">${instructionText}</span>
                                    </div>
                                </div>
                                <button class="edit-btn" onclick="openEditModal(${index})">Edit</button>
                            </div>

                            <div class="item-bottom-row">
                                <div class="qty-controls-cart">
                                    <button class="qty-btn-cart" onclick="updateCartQty(${index}, -1)">−</button>
                                    <span class="qty-val-cart">${item.qty}</span>
                                    <button class="qty-btn-cart" onclick="updateCartQty(${index}, 1)">+</button>
                                </div>
                                <div class="item-total-price">₹${itemPriceTotal}</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += itemHTML;
            });

            // Update Billing
            document.getElementById('items-count-label').textContent = `Items (${totalItems})`;
            document.getElementById('bill-item-total-label').textContent = `Item Total (${totalItems} items)`;
            document.getElementById('bill-item-total').textContent = `₹${totalPrice}`;
            
            let gst = Math.round(totalPrice * 0.05);
            if(totalPrice === 0) gst = 0;
            document.getElementById('bill-gst').textContent = `₹${gst}`;
            document.getElementById('bill-grand-total').textContent = `₹${totalPrice + gst}`;
        }

        function deleteItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('spiceCart', JSON.stringify(cart));
            renderCart();
        }

        function updateCartQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty < 1) cart[index].qty = 1;
            localStorage.setItem('spiceCart', JSON.stringify(cart));
            renderCart();
        }

        // ================= Modal Logic =================
        const modal = document.getElementById('instructions-modal');
        const modalText = document.getElementById('modal-inst-text');
        const modalCount = document.getElementById('modal-char-count');

        function openEditModal(index) {
            currentEditIndex = index;
            modalText.value = cart[index].instructions || '';
            updateModalCounter();
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        modalText.addEventListener('input', updateModalCounter);
        function updateModalCounter() {
            const len = modalText.value.length;
            modalCount.textContent = `${len}/100`;
        }

        function saveInstructions() {
            if(currentEditIndex > -1) {
                cart[currentEditIndex].instructions = modalText.value;
                localStorage.setItem('spiceCart', JSON.stringify(cart));
                renderCart();
                closeModal();
            }
        }

        function deleteItemFromModal() {
            if(currentEditIndex > -1) {
                deleteItem(currentEditIndex);
                closeModal();
            }
        }

        modal.addEventListener('click', function(e) {
            if (e.target === this) { closeModal(); }
        });

        // ================= UPDATED: GO TO PAYMENT PAGE =================
        function placeOrder() {
            if(cart.length === 0) {
                alert('Your cart is empty!');
            } else {
                // Extract totals from the HTML
                const itemTotal = document.getElementById('bill-item-total').textContent.replace('₹', '');
                const gst = document.getElementById('bill-gst').textContent.replace('₹', '');
                const grandTotal = document.getElementById('bill-grand-total').textContent.replace('₹', '');
                
                // Pass the data to the payment page via URL parameters
                const params = new URLSearchParams({
                    itemTotal: itemTotal,
                    gst: gst,
                    packing: 20, // Static packing charge as per screenshot
                    grandTotal: grandTotal
                });
                
                // FIXED: Changed '/payment.html?' to 'payment.html?'
                window.location.href = 'payment.html?' + params.toString();
            }
        }

        renderCart();
    </script>
</body>
</html>
