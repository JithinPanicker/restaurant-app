<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    
    <style>
        /* Order Status Specific Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #ffffff; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: flex-start; }
        
        .status-wrapper {
            width: 100%; max-width: 450px; background: #ffffff;
            padding: 25px 20px 30px 20px; min-height: 100vh; 
            display: flex; flex-direction: column; position: relative;
        }

        /* Header */
        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .status-back { display: flex; align-items: center; cursor: pointer; }
        .status-title { font-size: 18px; font-weight: 700; color: #111; }
        .status-table-text { font-size: 16px; font-weight: 700; color: #FF3300; }

        /* Order Number */
        .status-content {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; padding-top: 20px;
        }

        .status-order-num {
            font-size: 26px; font-weight: 700; color: #FF3300;
            margin-bottom: 35px; letter-spacing: 0.5px;
        }

        /* ============ TIMELINE FLOW ============ */
        .timeline {
            display: flex; flex-direction: column;
            width: 100%; padding-left: 10px;
            margin-bottom: 40px;
        }

        .timeline-step {
            position: relative;
            display: flex;
            align-items: center;
            padding-bottom: 25px; /* Provides space between the steps */
            z-index: 2;
        }

        .timeline-step:last-child {
            padding-bottom: 0;
        }

        /* The vertical connecting line */
        .line-connector {
            position: absolute;
            left: 19px; /* Centers perfectly behind the 42px dot */
            top: 42px;  /* Starts exactly at the bottom of the dot */
            bottom: -25px; /* Stretches down into the padding to meet the next dot */
            width: 4px;
            z-index: 0;
        }

        /* Hide the connecting line for the very last item */
        .timeline-step:last-child .line-connector {
            display: none;
        }

        .line-connector.green { background: #158C26; }
        .line-connector.grey { background: #d1d1d1; }

        /* The Dots / Nodes */
        .dot-wrapper {
            position: relative; z-index: 1;
            display: flex; align-items: center; width: 100%;
        }

        .dot {
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin-right: 18px; flex-shrink: 0;
            z-index: 1; /* Ensures the dot sits ON TOP of the connector line */
        }

        .dot.green { background: #158C26; }
        .dot.grey { background: #d1d1d1; }
        
        .dot svg { width: 20px; height: 20px; }
        .dot svg.stroke-white { stroke: #ffffff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .dot svg.fill-white { fill: #ffffff; }

        .timeline-label {
            font-size: 17px; font-weight: 700; color: #111;
        }
        /* ============ END TIMELINE FLOW ============ */

        /* Notification Text */
        .status-notification {
            font-size: 15px; font-weight: 400; color: #111;
            text-align: center; line-height: 1.6;
            max-width: 280px; margin-bottom: auto;
        }

        /* Buttons */
        .status-actions {
            margin-top: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .status-action-row {
            display: flex; gap: 12px; width: 100%;
        }
        .status-btn {
            flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px;
            background: transparent; border: 1px solid #FF3300;
            border-radius: 12px; padding: 14px 10px;
            font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600;
            color: #FF3300; cursor: pointer; transition: 0.1s ease;
        }
        .status-btn.full-width { flex: none; width: 100%; }
        .status-btn:active { transform: scale(0.97); background: #FFF0E8; }
        
        .status-btn svg { width: 20px; height: 20px; stroke: #FF3300; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .status-btn svg.no-stroke { stroke: none; fill: #FF3300; }
    </style>
</head>
<body>

    <div class="status-wrapper">
        
        <!-- Header -->
        <div class="status-header">
            <div class="status-back" onclick="window.location.href='order-confirmed.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </div>
            <h2 class="status-title">Order Status</h2>
            <span class="status-table-text" id="status-table-text">Table 05</span>
        </div>

        <!-- Order Number -->
        <div class="status-content">
            <h2 class="status-order-num">Order #<span id="status-order-num">101</span></h2>

            <!-- Timeline Flow -->
            <div class="timeline">
                <!-- Step 1: Confirmed -->
                <div class="timeline-step">
                    <div class="line-connector green"></div>
                    <div class="dot-wrapper">
                        <div class="dot green">
                            <svg class="stroke-white" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                        <span class="timeline-label">Order Confirmed</span>
                    </div>
                </div>

                <!-- Step 2: Preparing -->
                <div class="timeline-step">
                    <div class="line-connector green"></div>
                    <div class="dot-wrapper">
                        <div class="dot green">
                            <svg class="fill-white" viewBox="0 0 24 24"><path d="M12 2C9.24 2 7 4.24 7 7v2H5c-1.1 0-2 .9-2 2v3h2v5c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-5h2v-3c0-1.1-.9-2-2-2h-2V7c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v2H9V7c0-1.66 1.34-3 3-3zM7 15h10v3H7v-3zm-1-3h12v1H6v-1z"/></svg>
                        </div>
                        <span class="timeline-label">Preparing</span>
                    </div>
                </div>

                <!-- Step 3: Ready -->
                <div class="timeline-step">
                    <div class="line-connector grey"></div>
                    <div class="dot-wrapper">
                        <div class="dot grey">
                            <svg class="fill-white" viewBox="0 0 24 24"><path d="M4 14h16v2H4z M5 9c0 3.87 3.13 7 7 7s7-3.13 7-7-3.13-7-7-7-7 3.13-7 7z"/></svg>
                        </div>
                        <span class="timeline-label">Ready</span>
                    </div>
                </div>

                <!-- Step 4: Served -->
                <div class="timeline-step">
                    <div class="dot-wrapper">
                        <div class="dot grey">
                            <svg class="stroke-white" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></svg>
                        </div>
                        <span class="timeline-label">Served</span>
                    </div>
                </div>
            </div>

            <p class="status-notification">We will notify you when your<br>order is ready.</p>
        </div>

        <!-- Action Buttons -->
        <div class="status-actions">
            <div class="status-action-row">
                <button class="status-btn" onclick="alert('Calling the waiter!');">
                    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    Call Waiter
                </button>
                <button class="status-btn" onclick="window.location.href='menu.html'">
                    <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    Order More
                </button>
            </div>
            
            <button class="status-btn full-width" onclick="alert('Requesting bill...');">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Request Bill
            </button>
        </div>
    </div>

    <script>
        // Parse the URL parameters to get order number and table number
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order') || '101';
        const tableId = urlParams.get('table') || '05';

        // Update the page with the dynamic values
        document.getElementById('status-order-num').textContent = orderId;
        document.getElementById('status-table-text').textContent = `Table ${tableId}`;
    </script>
</body>
</html>
