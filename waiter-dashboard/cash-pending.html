<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Waiter - Cash Pending</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f9f9f9; padding-bottom: 85px; color: #1a1a1a; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px 15px 0 15px; background: #fff; }

        /* Header */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px 0; }
        .top-header h2 { font-size: 18px; font-weight: 600; }
        .header-icon { width: 24px; height: 24px; cursor: pointer; }

        /* Sub header */
        .sub-header { margin-bottom: 15px; }
        .sub-header h3 { color: #1a1a1a; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .sub-header p { font-size: 13px; color: #777; }

        /* Order Card */
        .order-card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; margin-bottom: 15px; transition: all 0.3s ease; }
        .order-card.collected { opacity: 0.3; pointer-events: none; }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .table-info { display: flex; gap: 12px; }
        .table-icon-box { width: 44px; height: 44px; background: #fff0f0; border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .table-icon-box.green { background: #eaf8ee; }
        .table-info h4 { font-size: 16px; font-weight: 600; }
        .order-id { font-size: 12px; color: #777; margin-top: 2px; }
        
        .time-status { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .time { font-size: 12px; color: #555; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.red { background: #d91e24; }
        .badge-group { display: flex; align-items: center; gap: 6px; }
        .badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; }
        .badge.cash { background: #ffe5e5; color: #d91e24; }

        .card-middle { display: flex; justify-content: space-between; margin: 12px 0 4px 0; padding-left: 56px; font-weight: 600; font-size: 15px; }
        .items-list { font-size: 13px; color: #555; padding-left: 56px; margin-bottom: 15px; }

        /* Status Row Styles (dotted line & pending badge) */
        .status-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #d5d5d5; }
        .status-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #1a1a1a; }
        .status-badge-pending { background: #fde8e8; color: #c9302c; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; }

        .card-actions { display: flex; gap: 12px; margin-top: 15px; }
        .btn-view-details { flex: 1; background: #fff; border: 1px solid #d91e24; color: #d91e24; padding: 10px; border-radius: 8px; font-weight: 500; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; }
        .btn-cash-collected { flex: 1.5; background: #d91e24; border: none; color: #fff; padding: 10px; border-radius: 8px; font-weight: 500; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-cash-collected:active { background: #b5151a; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0 20px 0; border-top: 1px solid #eee; box-shadow: 0 -2px 8px rgba(0,0,0,0.02); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #999; cursor: pointer; position: relative; gap: 4px; }
        .nav-item.active { color: #fca311; } /* Orange for cash pending */
        .nav-icon-wrapper { position: relative; }
        .nav-badge { position: absolute; top: -6px; right: -8px; background: #1a1a1a; color: #fff; font-size: 9px; font-weight: 600; width: 16px; height: 16px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .nav-item.active .nav-badge { background: #fca311; } /* Orange badge */
        .empty-msg { text-align: center; color: #777; padding: 40px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-icon" style="display: flex; align-items: center;" onclick="window.location.href='menu.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </div>
            <h2>Cash Pending</h2>
            <div class="header-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
        </header>

        <!-- Sub Header -->
        <div class="sub-header">
            <h3>Cash Pending <span id="cashCount" style="font-weight: 400;">(0)</span></h3>
            <p>Cash payment orders that are placed but not yet verified and completed.</p>
        </div>

        <div id="cashPendingListContainer">
            <!-- Cards will be rendered by JS -->
            <div class="empty-msg">No cash pending orders.</div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='waiter-dashboard.html'">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="nav-badge">3</span>
            </div>
            <span>New Orders</span>
        </div>
        <div class="nav-item" onclick="window.location.href='waiter-verification.html'">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="nav-badge">0</span>
            </div>
            <span>Order Verification</span>
        </div>
        <div class="nav-item active">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fca311" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                    <line x1="1" y1="10" x2="23" y2="10"></line>
                </svg>
                <span class="nav-badge" id="cashPendingBadge">0</span>
            </div>
            <span>Cash Pending</span>
        </div>
        <div class="nav-item" onclick="window.location.href='ready-to-serve.html'">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="nav-badge" id="readyBadge">0</span>
            </div>
            <span>Ready to Serve</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="nav-badge">4</span>
            </div>
            <span>Requests</span>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('cashPendingListContainer');
            const cashCountSpan = document.getElementById('cashCount');
            const cashPendingBadge = document.getElementById('cashPendingBadge');

            function renderCashPendingOrders() {
                let orders = JSON.parse(localStorage.getItem('cashPendingOrders')) || [];
                cashCountSpan.textContent = `(${orders.length})`;
                cashPendingBadge.textContent = orders.length;

                if (orders.length === 0) {
                    container.innerHTML = '<div class="empty-msg">No cash pending orders.</div>';
                    return;
                }

                let html = '';
                orders.forEach((order, index) => {
                    let iconClass = (order.table.includes('05') ? '' : (order.table.includes('09') ? 'green' : ''));
                    html += `
                        <div class="order-card" data-index="${index}">
                            <div class="card-top">
                                <div class="table-info">
                                    <div class="table-icon-box ${iconClass}">
                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d91e24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 3h18v18H3z"></path>
                                            <path d="M3 9h18"></path>
                                            <path d="M9 21V9"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <h4>${order.table}</h4>
                                        <div class="order-id">Order ID: ${order.id}</div>
                                    </div>
                                </div>
                                <div class="time-status">
                                    <div class="badge-group">
                                        <span class="time">${order.time}</span>
                                        <span class="status-dot red"></span>
                                        <span class="badge cash">${order.payment}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="card-middle">
                                <div style="display:flex;align-items:center;gap:6px;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                                    ${order.count}
                                </div>
                                <div>${order.total}</div>
                            </div>
                            <div class="items-list">${order.items}</div>
                            
                            <!-- Status Row (Dashed line) -->
                            <div class="status-row">
                                <div class="status-label">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fca311" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                    Status
                                </div>
                                <div class="status-badge-pending">Pending</div>
                            </div>

                            <div class="card-actions">
                                <button class="btn-view-details">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="8" y1="6" x2="21" y2="6"></line>
                                        <line x1="8" y1="12" x2="21" y2="12"></line>
                                        <line x1="8" y1="18" x2="21" y2="18"></line>
                                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                                    </svg> View Details
                                </button>
                                <button class="btn-cash-collected" onclick="collectCash(${index})">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                        <line x1="1" y1="10" x2="23" y2="10"></line>
                                    </svg> Cash Collected
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            window.collectCash = function(index) {
                let orders = JSON.parse(localStorage.getItem('cashPendingOrders')) || [];
                let movedOrder = orders[index];
                
                // Remove from Cash Pending list
                orders.splice(index, 1);
                localStorage.setItem('cashPendingOrders', JSON.stringify(orders));

                // Add to Ready to Serve list
                let readyOrders = JSON.parse(localStorage.getItem('readyToServeOrders')) || [];
                readyOrders.push(movedOrder);
                localStorage.setItem('readyToServeOrders', JSON.stringify(readyOrders));

                // Redirect to Ready to Serve page
                window.location.href = 'ready-to-serve.html';
            };

            renderCashPendingOrders();
        });
    </script>
</body>
</html>
