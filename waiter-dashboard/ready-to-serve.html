<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Waiter - Ready to Serve</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f9f9f9; padding-bottom: 85px; color: #1a1a1a; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px 15px 0 15px; background: #fff; }

        /* Header */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px 0; }
        .top-header h2 { font-size: 18px; font-weight: 600; }
        .header-icon { width: 24px; height: 24px; cursor: pointer; }

        /* Sub header */
        .sub-header { margin-bottom: 15px; }
        .sub-header h3 { color: #ff4d00; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .sub-header p { font-size: 13px; color: #777; }

        /* Tabs */
        .tabs-container { display: flex; gap: 12px; margin-bottom: 20px; }
        .tab-btn { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
            background: #fff; 
            font-weight: 600; 
            font-size: 14px; 
            color: #1a1a1a; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .tab-btn.active { 
            background: #ff4d00; 
            border-color: #ff4d00; 
            color: #fff; 
        }
        .tab-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; }
        .tab-btn svg.fill-path { fill: currentColor; stroke: none; }

        /* Order Card */
        .order-card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; margin-bottom: 15px; }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .table-info { display: flex; gap: 12px; }
        .table-icon-box { width: 44px; height: 44px; background: #fff0f0; border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .table-icon-box.blue { background: #eaf2ff; }
        .table-icon-box.green { background: #eaf8ee; }
        .table-info h4 { font-size: 16px; font-weight: 600; }
        .order-id { font-size: 12px; color: #777; margin-top: 2px; }
        
        .time-status { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .time { font-size: 12px; color: #555; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.red { background: #d91e24; }
        .badge-group { display: flex; align-items: center; gap: 6px; }
        .badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; }
        .badge.cash { background: #ffe5e5; color: #d91e24; }
        .badge.online { background: #e5e5ff; color: #4d47eb; }

        .card-middle { display: flex; justify-content: space-between; margin: 12px 0 4px 0; padding-left: 56px; font-weight: 600; font-size: 15px; }
        .items-list { font-size: 13px; color: #555; padding-left: 56px; margin-bottom: 15px; }

        /* Status Row Styles (Ready green) */
        .status-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #d5d5d5; }
        .status-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #1a1a1a; }
        .status-label svg { stroke: #28a745; } /* Green check */
        .status-badge-ready { background: #eaf8ee; color: #28a745; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; }

        .card-actions { display: flex; gap: 12px; margin-top: 15px; }
        .btn-view-details { flex: 1; background: #fff; border: 1px solid #ff4d00; color: #ff4d00; padding: 10px; border-radius: 8px; font-weight: 500; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; }
        .btn-order-served { flex: 1.5; background: #ff4d00; border: none; color: #fff; padding: 10px; border-radius: 8px; font-weight: 500; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-order-served:active { background: #e64400; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0 20px 0; border-top: 1px solid #eee; box-shadow: 0 -2px 8px rgba(0,0,0,0.02); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #999; cursor: pointer; position: relative; gap: 4px; }
        .nav-item.active { color: #ff4d00; } /* Orange */
        .nav-icon-wrapper { position: relative; }
        .nav-badge { position: absolute; top: -6px; right: -8px; background: #1a1a1a; color: #fff; font-size: 9px; font-weight: 600; width: 16px; height: 16px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .nav-item.active .nav-badge { background: #ff4d00; } /* Orange badge */
        .empty-msg { text-align: center; color: #777; padding: 40px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-icon" style="display: flex; align-items: center;" onclick="window.location.href='menu.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </div>
            <h2>Ready to Serve</h2>
            <div class="header-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
        </header>

        <!-- Sub Header -->
        <div class="sub-header">
            <h3>Ready to Serve <span id="totalReadyCount" style="font-weight: 400;">(0)</span></h3>
            <p>Orders that are prepared and ready to be served to the customers.</p>
        </div>

        <!-- Tab Buttons -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('CASH')" id="tabCash">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><circle cx="12" cy="12" r="2"></circle></svg>
                CASH (<span id="cashTabCount">0</span>)
            </button>
            <button class="tab-btn" onclick="switchTab('ONLINE')" id="tabOnline">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                ONLINE (<span id="onlineTabCount">0</span>)
            </button>
        </div>

        <div id="readyListContainer">
            <!-- Cards will be rendered by JS -->
            <div class="empty-msg">No ready to serve orders.</div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='waiter-dashboard.html'">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="nav-badge">3</span>
            </div>
            <span>New Orders</span>
        </div>
        <div class="nav-item" onclick="window.location.href='waiter-verification.html'">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="nav-badge">0</span>
            </div>
            <span>Order Verification</span>
        </div>
        <div class="nav-item" onclick="window.location.href='cash-pending.html'">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                    <line x1="1" y1="10" x2="23" y2="10"></line>
                </svg>
                <span class="nav-badge">0</span>
            </div>
            <span>Cash Pending</span>
        </div>
        <div class="nav-item active">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff4d00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="nav-badge" id="readyBadge">0</span>
            </div>
            <span>Ready to Serve</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="nav-badge">4</span>
            </div>
            <span>Requests</span>
        </div>
    </nav>

    <script>
        let currentFilter = 'CASH';

        document.addEventListener('DOMContentLoaded', function() {
            renderReadyOrders();
        });

        window.switchTab = function(type) {
            currentFilter = type;
            // Update active tab UI
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(type === 'CASH') document.getElementById('tabCash').classList.add('active');
            else document.getElementById('tabOnline').classList.add('active');
            renderReadyOrders();
        };

        function renderReadyOrders() {
            const container = document.getElementById('readyListContainer');
            let orders = JSON.parse(localStorage.getItem('readyToServeOrders')) || [];

            // Update Badges
            const cashCount = orders.filter(o => o.payment === 'CASH').length;
            const onlineCount = orders.filter(o => o.payment === 'ONLINE').length;
            const totalCount = orders.length;

            document.getElementById('cashTabCount').textContent = cashCount;
            document.getElementById('onlineTabCount').textContent = onlineCount;
            document.getElementById('totalReadyCount').textContent = `(${totalCount})`;
            document.getElementById('readyBadge').textContent = totalCount;

            // Filter orders based on active tab
            let filteredOrders = orders.filter(o => o.payment === currentFilter);

            if (filteredOrders.length === 0) {
                container.innerHTML = `<div class="empty-msg">No ${currentFilter} orders ready to serve.</div>`;
                return;
            }

            let html = '';
            filteredOrders.forEach((order, index) => {
                // Find the real index for the serve action
                const realIndex = orders.findIndex(o => o.id === order.id && o.table === order.table);
                
                let iconClass = '';
                if(order.table.includes('05')) iconClass = '';
                else if(order.table.includes('09')) iconClass = 'green';
                else if(order.table.includes('12')) iconClass = 'blue';

                let badgeClass = order.payment === 'CASH' ? 'cash' : 'online';

                html += `
                    <div class="order-card" data-index="${realIndex}">
                        <div class="card-top">
                            <div class="table-info">
                                <div class="table-icon-box ${iconClass}">
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d91e24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 3h18v18H3z"></path>
                                        <path d="M3 9h18"></path>
                                        <path d="M9 21V9"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h4>${order.table}</h4>
                                    <div class="order-id">Order ID: ${order.id}</div>
                                </div>
                            </div>
                            <div class="time-status">
                                <div class="badge-group">
                                    <span class="time">${order.time}</span>
                                    <span class="status-dot red"></span>
                                    <span class="badge ${badgeClass}">${order.payment}</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-middle">
                            <div style="display:flex;align-items:center;gap:6px;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                                ${order.count}
                            </div>
                            <div>${order.total}</div>
                        </div>
                        <div class="items-list">${order.items}</div>
                        
                        <!-- Status Row (Green Check, Green Badge) -->
                        <div class="status-row">
                            <div class="status-label">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="9 12 11 14 15 10"></polyline></svg>
                                Status
                            </div>
                            <div class="status-badge-ready">Ready</div>
                        </div>

                        <div class="card-actions">
                            <button class="btn-view-details">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="8" y1="6" x2="21" y2="6"></line>
                                    <line x1="8" y1="12" x2="21" y2="12"></line>
                                    <line x1="8" y1="18" x2="21" y2="18"></line>
                                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                                </svg> View Details
                            </button>
                            <button class="btn-order-served" onclick="serveOrder(${realIndex})">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                </svg> Order Served
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.serveOrder = function(index) {
            let orders = JSON.parse(localStorage.getItem('readyToServeOrders')) || [];
            orders.splice(index, 1);
            localStorage.setItem('readyToServeOrders', JSON.stringify(orders));
            renderReadyOrders(); // Re-render list immediately
        };
    </script>
</body>
</html>
