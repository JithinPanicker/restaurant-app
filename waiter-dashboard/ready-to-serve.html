<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Waiter Dashboard - Ready to Serve</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f9f9f9; padding-bottom: 85px; color: #1a1a1a; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px 15px 0 15px; background: #fff; }

        /* Top Header */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px 0; }
        .top-header h2 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
        .header-icon { width: 24px; height: 24px; cursor: pointer; }

        /* Sub header */
        .sub-header { margin-bottom: 20px; }
        .sub-header h3 { color: #ff4b00; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .sub-header h3 span { font-weight: 400; }
        .sub-desc { font-size: 14px; color: #777; line-height: 1.4; }

        /* Segmented Control (Toggle) */
        .segmented-control { display: flex; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: #fff; border: none; padding: 10px; font-weight: 600; font-size: 14px; color: #ff4b00; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
        .tab-btn.active { background: #ff4b00; color: #fff; }
        .tab-btn:first-child { border-right: 1px solid #ddd; }
        .tab-btn.active:first-child { border-right: none; }

        /* Order Card */
        .order-card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; margin-bottom: 15px; transition: all 0.3s ease; }
        .order-card.served { opacity: 0.5; pointer-events: none; background: #f5f5f5; transform: scale(0.98); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .table-info { display: flex; gap: 12px; }
        .table-icon-box { width: 44px; height: 44px; border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .table-icon-box.red { background: #fff0f0; }
        .table-info h4 { font-size: 17px; font-weight: 600; margin-top: -2px; }
        .order-id { font-size: 12px; color: #777; margin-top: 1px; }
        
        .time-status { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
        .time-group { display: flex; align-items: center; gap: 6px; }
        .time { font-size: 12px; color: #555; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.red { background: #ff0000; }

        .badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; }
        .badge.cash { background: #ffe5e5; color: #d91e24; }
        .badge.online { background: #f3e5f5; color: #8e24aa; }

        .card-middle { display: flex; justify-content: space-between; margin: 14px 0 0 0; padding-left: 56px; font-weight: 600; font-size: 15px; color: #1a1a1a; }
        .card-middle-left { display: flex; align-items: center; gap: 6px; }
        .items-list { font-size: 13px; color: #555; padding-left: 56px; margin-top: 4px; margin-bottom: 12px; }

        /* Status Section with dashed line */
        .card-status-wrapper { border-top: 1px dashed #e8e8e8; padding-top: 14px; margin: 0 0 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .status-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #333; }
        .status-label svg { stroke: #2e7d32; }
        .badge-status { background: #e8f5e9; color: #2e7d32; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 20px; }

        /* Actions */
        .card-actions { display: flex; gap: 12px; }
        .btn-view-details { flex: 1; background: #fff; border: 1px solid #ff4b00; color: #ff4b00; padding: 10px; border-radius: 8px; font-weight: 500; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; }
        .btn-order-served { flex: 1; background: #ff4b00; border: none; color: #fff; padding: 10px; border-radius: 8px; font-weight: 500; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-order-served:active { background: #d63c00; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0 20px 0; border-top: 1px solid #eee; box-shadow: 0 -2px 8px rgba(0,0,0,0.02); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #999; cursor: pointer; position: relative; gap: 4px; }
        .nav-item.active { color: #ff4b00; }
        .nav-item.active svg { stroke: #ff4b00; }
        .nav-icon-wrapper { position: relative; }
        .nav-badge { position: absolute; top: -6px; right: -8px; background: #1a1a1a; color: #fff; font-size: 9px; font-weight: 600; width: 16px; height: 16px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .nav-item.active .nav-badge { background: #ff4b00; }
        .empty-msg { text-align: center; color: #777; padding: 40px 0; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-icon" style="display: flex; align-items: center;" onclick="window.location.href='menu.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </div>
            <h2>Ready to Serve</h2>
            <div class="header-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
        </header>

        <!-- Sub Header -->
        <div class="sub-header">
            <h3>Ready to Serve <span id="orderCount">(3)</span></h3>
            <p class="sub-desc">Orders that are prepared and ready to be served to the customers.</p>
        </div>

        <!-- Segmented Control -->
        <div class="segmented-control">
            <button class="tab-btn" data-type="CASH">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
                CASH (2)
            </button>
            <button class="tab-btn active" data-type="ONLINE">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="18" y2="8"></line></svg>
                ONLINE (1)
            </button>
        </div>

        <div id="orderListContainer">
            <div class="empty-msg" id="emptyMsg">No pending orders in this category.</div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='waiter-dashboard.html'">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="nav-badge">3</span>
            </div>
            <span>New Orders</span>
        </div>
        <div class="nav-item" onclick="window.location.href='waiter-verification.html'">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="nav-badge">2</span>
            </div>
            <span>Order Verification</span>
        </div>
        <div class="nav-item" onclick="window.location.href='cash-pending.html'">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                    <line x1="1" y1="10" x2="23" y2="10"></line>
                </svg>
                <span class="nav-badge">2</span>
            </div>
            <span>Cash Pending</span>
        </div>
        <!-- Active Red Tab -->
        <div class="nav-item active">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="nav-badge" id="readyBadge">3</span>
            </div>
            <span>Ready to Serve</span>
        </div>
        <div class="nav-item" onclick="window.location.href='requests.html'">
            <div class="nav-icon-wrapper">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="nav-badge">4</span>
            </div>
            <span>Requests</span>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('orderListContainer');
            const emptyMsg = document.getElementById('emptyMsg');
            const badge = document.getElementById('readyBadge');
            const countSpan = document.getElementById('orderCount');
            let currentFilter = 'ONLINE'; // Default active tab

            // 1. Load existing orders
            let orders = JSON.parse(localStorage.getItem('readyToServeOrders'));

            // 2. FALLBACK: If empty, load the exact screenshot example data
            if (!orders || orders.length === 0) {
                orders = [
                    {"table":"Table 12", "id":"#ORD1257", "time":"10:26 AM", "payment":"ONLINE", "items":"1x Veg Burger, 1x French Fries, 1x Coke", "count":"3 Items", "total":"₹920"},
                    {"table":"Table 03", "id":"#ORD1255", "time":"10:15 AM", "payment":"CASH", "items":"1x Paneer Tikka, 1x Naan", "count":"2 Items", "total":"₹340"},
                    {"table":"Table 07", "id":"#ORD1260", "time":"10:35 AM", "payment":"CASH", "items":"1x Chicken Biryani, 1x Raita", "count":"2 Items", "total":"₹620"}
                ];
                localStorage.setItem('readyToServeOrders', JSON.stringify(orders));
            }

            function getBadgeClass(payment) {
                return payment === 'CASH' ? 'cash' : 'online';
            }

            function renderOrders(filterType) {
                const filtered = orders.filter(o => o.payment === filterType);
                container.innerHTML = '';
                
                // Update Main counts
                const cashCount = orders.filter(o => o.payment === 'CASH').length;
                const onlineCount = orders.filter(o => o.payment === 'ONLINE').length;
                
                // Update Toggle Text Counts
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    const type = btn.getAttribute('data-type');
                    const count = type === 'CASH' ? cashCount : onlineCount;
                    const label = type === 'CASH' ? 'CASH' : 'ONLINE';
                    
                    // Check if inner SVG exists to preserve it
                    const svg = btn.querySelector('svg').outerHTML;
                    btn.innerHTML = `${svg} ${label} (${count})`;
                });

                // Update Badge
                const totalCount = cashCount + onlineCount;
                badge.textContent = totalCount;
                countSpan.textContent = `(${totalCount})`;

                if (filtered.length === 0) {
                    emptyMsg.style.display = 'block';
                    return;
                } else {
                    emptyMsg.style.display = 'none';
                }

                filtered.forEach((order, idx) => {
                    const colorClass = 'red'; // Table 12 icon is red in screenshot, we'll use red for all here.

                    const cardHTML = `
                        <div class="order-card" data-index="${idx}" data-type="${order.payment}">
                            <!-- Top Section -->
                            <div class="card-top">
                                <div class="table-info">
                                    <div class="table-icon-box ${colorClass}">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d91e24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 3h18v18H3z"></path><path d="M3 9h18"></path><path d="M9 21V9"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <h4>${order.table}</h4>
                                        <div class="order-id">Order ID: ${order.id}</div>
                                    </div>
                                </div>
                                <div class="time-status">
                                    <div class="time-group">
                                        <span class="time">${order.time}</span>
                                        <span class="status-dot red"></span>
                                        <span class="badge ${getBadgeClass(order.payment)}">${order.payment}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Middle Items Section -->
                            <div class="card-middle">
                                <div class="card-middle-left">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                                    ${order.count}
                                </div>
                                <div>${order.total}</div>
                            </div>
                            <div class="items-list">${order.items}</div>

                            <!-- Status with Dashed Line -->
                            <div class="card-status-wrapper">
                                <div class="status-label">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                    Status
                                </div>
                                <span class="badge-status">Ready</span>
                            </div>

                            <!-- Actions -->
                            <div class="card-actions">
                                <button class="btn-view-details">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line>
                                        <line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>
                                    </svg> View Details
                                </button>
                                <button class="btn-order-served">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 15v4c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-4"></path>
                                        <path d="M12 3v12"></path>
                                        <path d="M8 7l4-4 4 4"></path>
                                        <path d="M20 15H4"></path>
                                    </svg> Order Served
                                </button>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });

                // Attach event listener to 'Order Served' buttons
                container.querySelectorAll('.btn-order-served').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const card = this.closest('.order-card');
                        const globalIndex = Array.from(container.children).indexOf(card); // Find exact position in DOM
                        
                        card.classList.add('served');
                        
                        setTimeout(() => {
                            // Remove from the actual global orders array by searching for ID or filtering
                            // Since the rendering uses a filtered view, we must find the real object in the master array
                            const tableName = card.querySelector('h4').innerText;
                            const orderIdText = card.querySelector('.order-id').innerText.replace('Order ID: ', '');
                            
                            // Remove correctly based on unique identifiers
                            const indexToRemove = orders.findIndex(o => o.table === tableName && o.id === orderIdText);
                            if (indexToRemove > -1) {
                                orders.splice(indexToRemove, 1);
                                localStorage.setItem('readyToServeOrders', JSON.stringify(orders));
                            }
                            
                            // Re-render based on current active filter
                            renderOrders(currentFilter);
                        }, 300);
                    });
                });
            }

            // Tab Switching Logic
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-type');
                    renderOrders(currentFilter);
                });
            });

            // Initial Render
            renderOrders(currentFilter);
        });
    </script>
</body>
</html>
