<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Waiter Dashboard - Order Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f9f9f9; padding-bottom: 85px; color: #1a1a1a; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px 15px 0 15px; background: #fff; }

        /* Status Bar */
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 0 15px 0; font-size: 14px; font-weight: 600; color: #1a1a1a; }
        .status-icons { display: flex; gap: 6px; align-items: center; }

        /* Top Header */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 5px 0 20px 0; }
        .top-header h2 { font-size: 18px; font-weight: 600; }
        .header-icon { width: 24px; height: 24px; cursor: pointer; }

        /* Sub header */
        .sub-header { margin-bottom: 20px; }
        .sub-header h3 { color: #1a1a1a; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .sub-header h3 span { font-weight: 400; color: #1a1a1a; }
        .sub-desc { font-size: 14px; color: #777; line-height: 1.4; }

        /* Order Card */
        .order-card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; margin-bottom: 15px; transition: all 0.3s ease; }
        .order-card.verified { opacity: 0.5; pointer-events: none; background: #f5f5f5; transform: scale(0.98); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .table-info { display: flex; gap: 12px; }
        .table-icon-box { width: 44px; height: 44px; border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .table-icon-box.red { background: #fff0f0; }
        .table-icon-box.green { background: #eaf8ee; }
        .table-info h4 { font-size: 17px; font-weight: 600; margin-top: -2px; }
        .order-id { font-size: 12px; color: #777; margin-top: 1px; }
        .time-status { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
        .time-group { display: flex; align-items: center; gap: 6px; }
        .time { font-size: 12px; color: #555; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.red { background: #ff0000; }
        .badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; }
        .badge.cash { background: #ffe5e5; color: #d91e24; }

        .card-middle { display: flex; justify-content: space-between; margin: 14px 0 0 0; padding-left: 56px; font-weight: 600; font-size: 15px; color: #1a1a1a; }
        .card-middle-left { display: flex; align-items: center; gap: 6px; }
        .items-list { font-size: 13px; color: #555; padding-left: 56px; margin-top: 4px; margin-bottom: 18px; }
        .card-actions { display: flex; gap: 12px; border-top: 1px solid #f5f5f5; padding-top: 15px; }
        .btn-view-details { flex: 1; background: #fff; border: 1px solid #d91e24; color: #d91e24; padding: 10px; border-radius: 8px; font-weight: 500; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; }
        .btn-mark-verified { flex: 1; background: #d91e24; border: none; color: #fff; padding: 10px; border-radius: 8px; font-weight: 500; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-mark-verified:active { background: #b5151a; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0 20px 0; border-top: 1px solid #eee; box-shadow: 0 -2px 8px rgba(0,0,0,0.02); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #999; cursor: pointer; position: relative; gap: 4px; }
        .nav-item.active { color: #d91e24; }
        .nav-icon-wrapper { position: relative; }
        .nav-badge { position: absolute; top: -6px; right: -8px; background: #1a1a1a; color: #fff; font-size: 9px; font-weight: 600; width: 16px; height: 16px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .nav-item.active .nav-badge { background: #d91e24; }
        .empty-msg { text-align: center; color: #777; padding: 40px 0; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Mock Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <svg width="16" height="12" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 9l4 4-4 4"/><path d="M9 21h10a2 2 0 002-2V5a2 2 0 00-2-2H9"/></svg>
                <svg width="16" height="12" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
                <svg width="20" height="12" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>
            </div>
        </div>

        <!-- Top Header -->
        <header class="top-header">
            <div class="header-icon" style="display: flex; align-items: center;" onclick="window.location.href='waiter-dashboard.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </div>
            <h2>Order Verification</h2>
            <div class="header-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14l2 2 4-4"></path></svg>
            </div>
        </header>

        <!-- Sub Header -->
        <div class="sub-header">
            <h3>Order Verification <span id="orderCount">(0)</span></h3>
            <p class="sub-desc">Verify cash payment orders before accepting and preparing.</p>
        </div>

        <div id="orderListContainer">
            <div class="empty-msg" id="emptyMsg">No pending cash orders to verify.</div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='waiter-dashboard.html'">
            <div class="nav-icon-wrapper"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="nav-badge">3</span></div>
            <span>New Orders</span>
        </div>
        <div class="nav-item active">
            <div class="nav-icon-wrapper"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span class="nav-badge" id="verificationBadge">0</span></div>
            <span>Order Verification</span>
        </div>
        <div class="nav-item" onclick="window.location.href='cash-pending.html'">
            <div class="nav-icon-wrapper"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg><span class="nav-badge">2</span></div>
            <span>Cash Pending</span>
        </div>
        <div class="nav-item" onclick="window.location.href='ready-to-serve.html'">
            <div class="nav-icon-wrapper"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span class="nav-badge">3</span></div>
            <span>Ready to Serve</span>
        </div>
        <div class="nav-item" onclick="window.location.href='requests.html'">
            <div class="nav-icon-wrapper"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="nav-badge">4</span></div>
            <span>Requests</span>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('orderListContainer');
            const emptyMsg = document.getElementById('emptyMsg');
            const badge = document.getElementById('verificationBadge');
            const countSpan = document.getElementById('orderCount');

            // 1. Load existing orders
            let orders = JSON.parse(localStorage.getItem('pendingVerificationOrders'));

            // 2. FALLBACK: If no orders exist in storage, load the exact screenshot example cards
            // This ensures the user sees the screenshot-like page instantly upon clicking the tab.
            if (!orders || orders.length === 0) {
                orders = [
                    {"table":"Table 05", "id":"#ORD1258", "time":"10:24 AM", "payment":"CASH", "items":"1x Margherita Pizza, 1x Veg Pasta", "count":"2 Items", "total":"₹560"},
                    {"table":"Table 09", "id":"#ORD1259", "time":"10:28 AM", "payment":"CASH", "items":"1x Grilled Sandwich, 1x Cold Coffee", "count":"2 Items", "total":"₹480"}
                ];
            }

            function renderOrders() {
                container.innerHTML = '';
                
                if (orders.length === 0) {
                    emptyMsg.style.display = 'block';
                    badge.textContent = '0';
                    countSpan.textContent = '(0)';
                    return;
                } else {
                    emptyMsg.style.display = 'none';
                    badge.textContent = orders.length;
                    countSpan.textContent = `(${orders.length})`;
                }

                orders.forEach((order, index) => {
                    const colorClass = index % 2 === 0 ? 'red' : 'green';
                    const strokeColor = index % 2 === 0 ? '#d91e24' : '#2e7d32';

                    // Use template literals to create the HTML
                    const cardHTML = `
                        <div class="order-card" data-index="${index}">
                            <div class="card-top">
                                <div class="table-info">
                                    <div class="table-icon-box ${colorClass}">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${strokeColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 3h18v18H3z"></path><path d="M3 9h18"></path><path d="M9 21V9"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <h4>${order.table}</h4>
                                        <div class="order-id">Order ID: ${order.id}</div>
                                    </div>
                                </div>
                                <div class="time-status">
                                    <div class="time-group">
                                        <span class="time">${order.time}</span>
                                        <span class="status-dot red"></span>
                                        <span class="badge cash">${order.payment}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="card-middle">
                                <div class="card-middle-left">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                                    ${order.count}
                                </div>
                                <div>${order.total}</div>
                            </div>
                            <div class="items-list">${order.items}</div>
                            <div class="card-actions">
                                <button class="btn-view-details">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line>
                                        <line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>
                                    </svg> View Details
                                </button>
                                <button class="btn-mark-verified">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg> Mark as Verified
                                </button>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });

                // Attach event listeners to newly created buttons
                container.querySelectorAll('.btn-mark-verified').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const card = this.closest('.order-card');
                        const index = parseInt(card.getAttribute('data-index'));
                        
                        card.classList.add('verified');
                        
                        setTimeout(() => {
                            orders.splice(index, 1);
                            localStorage.setItem('pendingVerificationOrders', JSON.stringify(orders));
                            renderOrders(); // Re-render to update indexes and badge counts
                        }, 300);
                    });
                });
            }

            renderOrders();
        });
    </script>
</body>
</html>
